<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UberX x SpaceX | Splash</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/utils.css">
</head>
<body class="bg-space">
    <header class="visually-hidden">
        <h1>Proyecto UberX SpaceX - Intergalactic Tourism</h1>
    </header>

    <main class="splash">
        <div class="splash__container">
            <div class="splash__logo-wrapper">
                <svg class="splash__logo" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
                    <text x="50%" y="55%" text-anchor="middle" class="splash__text">UBERX</text>
                    <path d="M20,80 Q100,20 180,80" fill="none" stroke="var(--accent)" stroke-width="2" class="splash__orbit" />
                </svg>
            </div>
            
            <p class="splash__subtitle">Preparing your space ride...</p>
            
            <a href="home.html" class="splash__skip-btn">Enter Mission</a>
        </div>
    </main>
</body>
</html>
